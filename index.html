*{box-sizing:border-box}
html{background:var(--bg)}

button{cursor:pointer;-webkit-tap-highlight-color:transparent}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.chip{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;font-weight:700;font-size:13px;line-height:1.2;color:inherit;text-align:left;min-width:0}.chip svg{color:var(--acc)}

html[data-tema=lavanda] .foto::before{display:none}html[data-tema=lavanda] .foto::after{height:40%;background:linear-gradient(0deg,rgba(247,241,252,.95),transparent)}
.foto-rodape{position:absolute;left:14px;right:14px;bottom:14px;z-index:2;display:grid;gap:10px}
.agua{justify-self:start;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:30px;font-weight:700;font-size:13px;color:inherit}

.blocos{display:grid;gap:12px;margin-top:14px}

/* páginas */
.pagina{display:none;animation:entra .25s ease}.pagina.on{display:block}

.cartao{padding:16px}

textarea{min-height:110px;resize:vertical;line-height:1.5}
label.campo{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--sub)}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--borda);background:var(--glass2);font-weight:800;font-size:14px;color:var(--txt);flex:none}

.btn.cheio{width:100%}
.vazio{color:var(--sub);font-size:14px;margin:4px 2px}
.dica{font-size:12px;color:var(--sub);line-height:1.5;margin:10px 2px 0}
/* água */
.copos{display:flex;flex-wrap:wrap;gap:8px}
.copo{width:38px;height:46px;border-radius:8px 8px 12px 12px;border:2px solid var(--acc);background:transparent;position:relative;overflow:hidden;padding:0}
.copo.on::after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(180deg,var(--acc2),var(--acc))}
/* ciclo */
.ciclo-topo{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.anel{--p:0;width:116px;height:116px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--cor,var(--acc)) calc(var(--p)*1%),var(--trilho) 0)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}

.cal button.m{background:var(--menst);color:#fff}.cal button.mp{background:color-mix(in srgb,var(--menst) 30%,transparent)}

.legenda{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--sub)}.legenda span{display:inline-flex;align-items:center;gap:6px}.legenda i{width:12px;height:12px;border-radius:4px;display:inline-block}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1px solid var(--borda);background:var(--glass2);border-radius:30px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--txt)}

/* treino */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.dia b{font-size:15px;color:var(--txt)}.dia.hoje{border-color:var(--acc);box-shadow:0 0 0 2px var(--trilho)}.dia.feito{background:var(--acc);color:var(--acc-txt)}.dia.feito b{color:var(--acc-txt)}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.nav{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(calc(100% - 24px),536px);display:grid;grid-template-columns:repeat(5,1fr);padding:7px;border-radius:26px;background:var(--nav);border:1px solid var(--borda);box-shadow:0 14px 34px -14px rgba(0,0,0,.45);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%)}

dialog::backdrop{background:rgba(10,8,30,.45);backdrop-filter:blur(4px)}

.toast.on{opacity:1}

/* ===== v3: vidro vivo + bichinho ===== */
.ambiente{position:fixed;inset:-6%;z-index:-1;pointer-events:none;background-size:cover;background-position:center 30%;opacity:.5;transform:scale(1.05);will-change:transform;animation:kb 40s ease-in-out infinite alternate}

body{background:linear-gradient(180deg,color-mix(in srgb,var(--bg-top) 70%,transparent) 0,color-mix(in srgb,var(--bg) 72%,transparent) 340px,color-mix(in srgb,var(--bg) 80%,transparent) 100%)}
.vidro{position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--glass) 92%,transparent),color-mix(in srgb,var(--glass) 55%,transparent))}
.vidro::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(220px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.45),transparent 60%);opacity:.55;mix-blend-mode:soft-light;transition:opacity .3s}
.vidro::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.12)}
.topo-ola{display:flex;align-items:center;gap:14px;margin-top:12px}
.topo-ola h1{margin:0}
.avatar{width:66px;height:66px;border-radius:50%;flex:none;padding:3px;background:conic-gradient(from 0deg,var(--acc),var(--acc2),var(--menst),var(--acc));animation:gira 9s linear infinite;box-shadow:0 10px 24px -10px var(--acc)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 40%;border:3px solid var(--bg);animation:gira 9s linear infinite reverse}
@keyframes gira{to{transform:rotate(360deg)}}
/* terrário */
.terrario{position:relative;margin:18px auto 0;width:min(100%,380px);aspect-ratio:1/1.02;display:grid;place-items:center}
.bolha{position:absolute;inset:0;border-radius:50%;overflow:hidden;isolation:isolate;background:var(--ceu);box-shadow:0 30px 60px -28px rgba(20,10,60,.6),inset 0 0 0 1.5px rgba(255,255,255,.55),inset 0 -30px 60px -20px rgba(255,255,255,.25)}
.bolha::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:50%;background:radial-gradient(60% 40% at 30% 18%,rgba(255,255,255,.65),transparent 60%),radial-gradient(30% 18% at 74% 82%,rgba(255,255,255,.25),transparent 70%),radial-gradient(circle at 50% 50%,transparent 62%,rgba(255,255,255,.28) 72%,transparent 74%)}
.bolha::after{content:"";position:absolute;inset:-30%;z-index:4;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 40%,rgba(255,255,255,.18) 46%,transparent 52% 100%);animation:gira 14s linear infinite;mix-blend-mode:overlay}
.ceu-dia{--ceu:radial-gradient(circle at 70% 25%,#fff7c2 0 9%,transparent 10%),linear-gradient(180deg,#8fd0ff,#d9f0ff 70%)}
.ceu-tarde{--ceu:radial-gradient(circle at 25% 62%,#ffe08a 0 9%,transparent 10%),linear-gradient(180deg,#6b56c8,#e78fb3 55%,#ffc58a 80%)}
.ceu-noite{--ceu:radial-gradient(circle at 72% 22%,#fffbe6 0 7%,transparent 7.5%),radial-gradient(circle at 76% 19%,#1b1946 0 6.5%,transparent 7%),linear-gradient(180deg,#0f1238,#2b2366 70%)}
.ceu-manha{--ceu:radial-gradient(circle at 20% 70%,#ffd6a0 0 9%,transparent 10%),linear-gradient(180deg,#a7c8ff,#ffd9e6 70%)}
.estrelas{position:absolute;inset:0;z-index:1;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 40% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 40%,#fff,transparent),radial-gradient(1px 1px at 85% 45%,#fff,transparent),radial-gradient(1px 1px at 30% 50%,#fff,transparent),radial-gradient(1.5px 1.5px at 12% 55%,#fff,transparent);animation:pisca 3s ease-in-out infinite alternate;display:none}
.ceu-noite .estrelas{display:block}
@keyframes pisca{to{opacity:.4}}
.nuvem{position:absolute;z-index:1;width:30%;height:9%;top:var(--t);left:-35%;border-radius:40px;background:rgba(255,255,255,.75);filter:blur(1px);animation:passa var(--d) linear infinite;animation-delay:var(--dl)}
.nuvem::before{content:"";position:absolute;width:50%;height:150%;left:20%;top:-60%;border-radius:50%;background:inherit}
.ceu-noite .nuvem{opacity:.12}
@keyframes passa{to{left:110%}}
.chao{position:absolute;z-index:2;left:-10%;right:-10%;bottom:-8%;height:36%;border-radius:50% 50% 0 0;background:radial-gradient(ellipse at 50% 0,#9ee39a,#4fb37a 60%,#2f8a63)}
.ceu-noite .chao{background:radial-gradient(ellipse at 50% 0,#3e6f6a,#1f4a4a 60%,#163636)}
.ceu-tarde .chao{background:radial-gradient(ellipse at 50% 0,#c6e39a,#7bb36f 60%,#4a8a5a)}
.flor{position:absolute;z-index:3;bottom:var(--b);left:var(--l);font-size:var(--s);animation:balanca 3s ease-in-out infinite alternate;transform-origin:bottom}
@keyframes balanca{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.particulas i{position:absolute;z-index:3;bottom:30%;left:var(--l);width:6px;height:6px;border-radius:50%;background:var(--pc,#fff8);animation:sobe var(--d) ease-in infinite;animation-delay:var(--dl);opacity:0}
.ceu-noite .particulas i{--pc:#fff36b;box-shadow:0 0 8px #fff36b}
@keyframes sobe{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-120px)}}
.bicho{position:relative;z-index:6;display:grid;place-items:center;margin-top:18%;cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.bicho .corpo{font-size:110px;line-height:1;filter:drop-shadow(0 14px 10px rgba(0,0,0,.25));animation:respira 2.6s ease-in-out infinite;display:block}
.bicho img.corpo{width:118px;height:auto}
.bicho .acc{position:absolute;font-size:34px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.bicho .sombra{position:absolute;bottom:-8px;width:60%;height:14px;border-radius:50%;background:rgba(0,0,0,.22);filter:blur(3px);animation:sombra 2.6s ease-in-out infinite}
@keyframes respira{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-8px) scale(1.02,.98)}}
@keyframes sombra{50%{transform:scale(.85);opacity:.7}}
.bicho.pula{transform:translateY(-34px) rotate(-6deg)}
.bicho.dorme .corpo{animation:dorme 4s ease-in-out infinite;filter:brightness(.8) drop-shadow(0 10px 8px rgba(0,0,0,.3))}
@keyframes dorme{50%{transform:scale(1.03,.96)}}
.bicho.doente .corpo{filter:grayscale(.7) brightness(.9) drop-shadow(0 10px 8px rgba(0,0,0,.25));animation-duration:5s}
.zzz{position:absolute;z-index:7;top:-6%;right:8%;font-weight:800;color:#fff;font-size:22px;animation:zzz 2.4s ease-in-out infinite;text-shadow:0 2px 6px #0006}
@keyframes zzz{0%{opacity:0;transform:translate(0,10px) scale(.7)}50%{opacity:1}100%{opacity:0;transform:translate(16px,-26px) scale(1.2)}}
.ovo{position:relative;width:118px;height:148px;border-radius:50% 50% 48% 48%/58% 58% 42% 42%;background:radial-gradient(circle at 35% 28%,#fff 0 12%,transparent 40%),radial-gradient(circle at 30% 60%,var(--c1) 0 8%,transparent 9%),radial-gradient(circle at 68% 42%,var(--c1) 0 10%,transparent 11%),radial-gradient(circle at 55% 78%,var(--c2) 0 7%,transparent 8%),linear-gradient(160deg,#fffaf0,#f1e3c9);box-shadow:inset -10px -14px 24px rgba(0,0,0,.12),0 16px 14px -6px rgba(0,0,0,.25);animation:balanca-ovo 3s ease-in-out infinite;transform-origin:50% 90%}
.ovo svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes balanca-ovo{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-7deg)}82%{transform:rotate(6deg)}88%{transform:rotate(-3deg)}}
.fala{position:absolute;z-index:8;top:6%;left:50%;transform:translateX(-50%);max-width:82%;padding:9px 13px;border-radius:16px;background:rgba(255,255,255,.92);color:#2a2340;font-weight:800;font-size:13px;text-align:center;box-shadow:0 8px 18px -8px rgba(0,0,0,.4);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
.fala.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.coracao{position:absolute;z-index:9;font-size:22px;pointer-events:none;animation:coracao 1.1s ease-out forwards}
@keyframes coracao{to{transform:translate(var(--x),-110px) scale(1.4);opacity:0}}
.pet-info{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.pet-info b{font:600 22px var(--serif)}.pet-info small{color:var(--sub);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.nivel{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:30px;background:var(--trilho);font-weight:800;font-size:12px;color:var(--acc)}
.barras{display:grid;gap:10px;margin-top:12px;padding:14px 16px}
.barra{display:grid;grid-template-columns:86px 1fr 38px;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.barra b{text-align:right;color:var(--txt);font-size:12px}
.liq{position:relative;height:14px;border-radius:10px;background:var(--trilho);overflow:hidden}
.liq i{position:absolute;inset:0 auto 0 0;border-radius:10px;background:linear-gradient(90deg,var(--c,var(--acc)),color-mix(in srgb,var(--c,var(--acc)) 55%,#fff));transition:width .8s cubic-bezier(.3,1.3,.5,1);overflow:hidden}
.liq i::after{content:"";position:absolute;inset:0;width:200%;background:repeating-linear-gradient(110deg,transparent 0 10px,rgba(255,255,255,.35) 10px 14px);animation:onda 1.6s linear infinite}
@keyframes onda{to{transform:translateX(-50%)}}
.xp{margin-top:6px}
.acoes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.acao{display:grid;justify-items:center;gap:6px;padding:14px 4px 12px;border-radius:20px;font-weight:800;font-size:12px;color:inherit;transform-style:preserve-3d;transition:transform .15s}
.acao span{font-size:28px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.22));transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.acao:active{transform:scale(.94)}.acao:active span{transform:translateY(-6px) scale(1.15)}
.acao.ok{outline:2px solid var(--ok);outline-offset:-2px}
.confete{position:fixed;z-index:60;top:-10px;pointer-events:none;font-size:20px;animation:cai var(--d) linear forwards}
@keyframes cai{to{transform:translate(var(--x),105vh) rotate(540deg)}}
.flash{position:fixed;inset:0;z-index:70;pointer-events:none;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);animation:flash 1.2s ease-out forwards}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.album div{display:grid;justify-items:center;gap:4px;padding:12px 6px;border-radius:16px;background:var(--glass2);border:1px solid var(--borda);text-align:center;font-size:12px}
.album span{font-size:36px}.album img{width:46px}

/* blocos do dia */
.blocos-dia{margin-top:14px;padding:16px 14px 14px;border-radius:22px}
.bd-topo{display:flex;justify-content:space-between;font:800 11px var(--mono,ui-monospace,'SFMono-Regular',Menlo,monospace);letter-spacing:.14em;color:var(--sub);text-transform:uppercase}
.bd-tit{font:800 30px/1.1 var(--sans);letter-spacing:-.02em;margin:6px 0 12px}
.linha-tempo{position:relative;margin-left:38px;border-left:1.5px solid color-mix(in srgb,var(--sub) 35%,transparent)}
.hora{position:absolute;left:-38px;width:30px;text-align:right;font:700 10px ui-monospace,Menlo,monospace;color:var(--sub);transform:translateY(-50%)}
.bloco-t{position:absolute;left:10px;right:0;border-radius:10px;border:1.5px solid var(--bc);background:color-mix(in srgb,var(--bc) 16%,var(--glass2) 40%);padding:7px 34px 6px 10px;text-align:left;color:var(--txt);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;font:inherit;transition:transform .15s,opacity .3s}
.bloco-t b{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bloco-t small{display:block;font:600 11px ui-monospace,Menlo,monospace;color:var(--sub);margin-top:2px;white-space:nowrap}
.bloco-t.feito{opacity:.55}.bloco-t.feito b{color:var(--sub)}
.bloco-t .ok{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--txt);opacity:0}
.bloco-t.feito .ok{opacity:.8}
.bloco-t.agora{box-shadow:0 0 0 2px color-mix(in srgb,var(--bc) 50%,transparent),0 10px 24px -12px var(--bc);opacity:1}
.bloco-t.atras:not(.feito){border-style:dashed}
.bloco-t:active{transform:scale(.98)}
.bloco-t .ed{position:absolute;right:4px;top:4px;width:26px;height:26px;border:0;border-radius:8px;background:transparent;color:var(--sub);display:grid;place-items:center;padding:0}
.bloco-t.feito .ed{display:none}
.agora-linha{position:absolute;left:-6px;right:-14px;height:0;border-top:2px solid #ff5a6a;z-index:5;pointer-events:none;transition:top 1s linear}
.agora-linha::before{content:"";position:absolute;left:-6px;top:-7px;width:12px;height:12px;border-radius:50%;background:#ff5a6a;box-shadow:0 0 0 4px rgba(255,90,106,.25);animation:pulso 2s ease-in-out infinite}
.agora-linha span{position:absolute;right:0;top:-18px;font:800 11px ui-monospace,Menlo,monospace;color:#ff5a6a;background:var(--glass2);padding:1px 5px;border-radius:6px}
@keyframes pulso{50%{box-shadow:0 0 0 9px rgba(255,90,106,0)}}
.bd-rodape{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font:800 11px ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--sub);text-transform:uppercase}
.cores{display:flex;gap:8px;flex-wrap:wrap}.cores label{position:relative}.cores input{position:absolute;opacity:0}.cores span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid transparent}.cores input:checked+span{border-color:var(--txt)}
.dias-sel{display:flex;gap:6px;flex-wrap:wrap}.dias-sel label{position:relative}.dias-sel input{position:absolute;opacity:0}.dias-sel span{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--borda);background:var(--glass2);font-weight:800;font-size:13px}.dias-sel input:checked+span{background:var(--acc);color:var(--acc-txt)}

.lembrete-tela{position:fixed;z-index:80;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-140%);width:min(calc(100% - 24px),520px);display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;color:var(--txt);text-align:left;transition:transform .45s cubic-bezier(.3,1.4,.5,1);background:var(--glass2)!important;box-shadow:0 18px 40px -16px rgba(0,0,0,.5)}
.lembrete-tela.on{transform:translate(-50%,0)}
.lembrete-tela>span{font-size:28px}.lembrete-tela div{flex:1;min-width:0}.lembrete-tela small{display:block;font:800 11px ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--sub);text-transform:uppercase}.lembrete-tela b{display:block;font-size:15px}.lembrete-tela i{color:var(--sub)}
.cadeado{position:fixed;inset:0;z-index:90;overflow:auto;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left)) 40px;background:linear-gradient(180deg,var(--bg-top),var(--bg))}
.cad-box{width:100%;max-width:440px;display:grid;gap:14px}
.cad-err{min-height:18px;color:var(--menst);font-weight:700;font-size:13px;text-align:center;margin:0}
.cad-passos{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px;line-height:1.5}.cad-passos code{font-size:12px;background:var(--trilho);padding:1px 5px;border-radius:5px;word-break:break-all}
.nuvem-st{position:absolute;left:16px;bottom:14px;width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.nuvem-st.busy{background:#e8b65a}.nuvem-st.off{background:var(--menst)}

/* ===== v4: botões, flutuante, banner, árvore, bíblia ===== */
.btn{position:relative;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--glass2) 96%,#fff 4%),color-mix(in srgb,var(--glass) 80%,transparent));border:1px solid var(--borda);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 16px -10px rgba(0,0,0,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .15s,box-shadow .2s}
.btn:active{transform:scale(.96)}
.btn.p{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 92%,#fff 8%),var(--acc) 45%,color-mix(in srgb,var(--acc2) 85%,var(--acc)));box-shadow:0 12px 26px -12px var(--acc),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.08)}
.btn.p::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:brilhoBtn 4s ease-in-out infinite;pointer-events:none}
@keyframes brilhoBtn{55%,100%{left:130%}}
.top{justify-content:space-between;padding-left:16px;padding-right:16px}
.top b{position:absolute;left:50%;transform:translateX(-50%)}
.sino{position:static}
.gnav{display:flex;gap:6px;padding:4px;border-radius:999px;background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,.08));border:1px solid var(--borda);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);box-shadow:0 8px 20px -12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.gnav button{width:32px;height:32px;border-radius:50%;border:1px solid var(--borda);background:var(--glass2);color:var(--txt);display:grid;place-items:center;padding:0;transition:transform .15s}
.gnav button svg{width:16px;height:16px}.gnav button:disabled{opacity:.35}.gnav button:active:not(:disabled){transform:scale(.9)}
.gnav button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--acc-txt);border-color:transparent}
.dir{display:flex;align-items:center;gap:4px}
.nuvem-st{position:static;display:inline-block;margin-right:6px}
.nav{grid-template-columns:repeat(6,1fr)}.nav button{font-size:10px}
/* pet flutuante */
.pet-flut{position:fixed;z-index:35;width:92px;height:92px;right:14px;bottom:calc(98px + env(safe-area-inset-bottom));border-radius:50%;touch-action:none;cursor:grab;animation:flutua 4s ease-in-out infinite}
.pet-flut .bolha{box-shadow:0 18px 30px -14px rgba(20,10,60,.55),inset 0 0 0 1.5px rgba(255,255,255,.7)}
.pet-flut .corpo-f{position:absolute;inset:0;display:grid;place-items:center;z-index:6;font-size:46px;filter:drop-shadow(0 6px 5px rgba(0,0,0,.25))}
.pet-flut .corpo-f img{width:58px}
.pet-flut .humor{position:absolute;z-index:7;top:-6px;right:-4px;font-size:20px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.pet-flut .nm{position:absolute;z-index:7;bottom:-18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;background:var(--glass2);border:1px solid var(--borda);color:var(--txt)}
@keyframes flutua{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.pet-flut.arrasta{animation:none;cursor:grabbing}
.pet-flut .ovo-mini{width:40px;height:52px;border-radius:50% 50% 48% 48%/58% 58% 42% 42%;background:radial-gradient(circle at 35% 28%,#fff 0 12%,transparent 40%),radial-gradient(circle at 32% 60%,var(--c1) 0 9%,transparent 10%),radial-gradient(circle at 66% 44%,var(--c1) 0 11%,transparent 12%),linear-gradient(160deg,#fffaf0,#f1e3c9);box-shadow:inset -4px -6px 10px rgba(0,0,0,.12)}
dialog.dlg-pet{width:min(94vw,460px);max-height:92vh;overflow:auto}
/* banner */
.saud{display:flex;align-items:center;gap:14px;margin-top:10px}
.saud h1{margin:0;font:500 clamp(26px,7.6vw,34px)/1.05 var(--serif)}
.saud small{display:block;color:var(--sub);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px}
.tilt{transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform}
.banner{margin-top:16px;min-height:210px;border-radius:26px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:18px;color:#fff;text-align:left;width:100%;border:1px solid rgba(255,255,255,.5);background-size:cover;background-position:50% 38%;box-shadow:0 24px 40px -22px rgba(10,10,40,.6)}
.banner::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(0,0,0,0) 20%,rgba(10,10,30,.62));pointer-events:none}
.banner>*{position:relative;transform:translateZ(30px)}
.banner .chip-d{align-self:flex-start;padding:6px 11px;border-radius:30px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.banner blockquote{margin:0;font:500 19px/1.35 var(--serif);text-shadow:0 2px 12px rgba(0,0,0,.4)}
.banner .ref{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.banner .brilho{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.35),transparent 60%);mix-blend-mode:soft-light;transform:none}
.principais{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}

 const total=tar.length+S.habitos.length+bl.length;const feitos=tar.filter(t=>t.feito===h).length+S.habitos.filter(x=>hd[x.id]).length+bl.filter(b=>bf[b.id]).length;return {tar,total,feitos,bl,bf}}
function ciclo(){const c=S.ciclo;if(!c.inicios.length)return null;const ini=c.inicios.slice().sort();const ult=ini[ini.length-1];
 const dur=duracaoMedia();const h=hoje();let prox=somaDias(ult,dur);while(difDias(prox,h)>0)prox=somaDias(prox,dur);
 const diaCiclo=((difDias(ult,h)%dur)+dur)%dur+1;const ovul=somaDias(prox,-14);const fIni=somaDias(ovul,-5),fFim=somaDias(ovul,1);
 const inicioAtual=somaDias(prox,-dur);const ovAtual=somaDias(inicioAtual,dur-14);
 let fase='Fase lútea',cor='var(--ovul)';
 if(diaCiclo<=c.menst){fase='Menstruação';cor='var(--menst)'}else if(h===ovAtual){fase='Dia provável da ovulação';cor='var(--fertil)'}
 else if(difDias(somaDias(ovAtual,-5),h)>=0&&difDias(h,somaDias(ovAtual,1))>=0){fase='Período fértil';cor='var(--fertil)'}else if(difDias(h,ovAtual)>0){fase='Fase folicular';cor='var(--acc)'}
 return {ult,dur,prox,diaCiclo,ovul,fIni,fFim,fase,cor,faltam:difDias(h,prox),fertilEm:difDias(h,fIni)}}
function duracaoMedia(){const i=S.ciclo.inicios.slice().sort();const d=[];for(let k=1;k<i.length;k++){const x=difDias(i[k-1],i[k]);if(x>=18&&x<=45)d.push(x)}const u=d.slice(-6);return u.length?Math.round(u.reduce((a,b)=>a+b,0)/u.length):S.ciclo.duracao}
function tipoDia(s){const c=S.ciclo;if(!c.inicios.length)return '';const dur=duracaoMedia();const ini=c.inicios.slice().sort();
 for(const i of ini){const k=difDias(i,s);if(k>=0&&k<c.menst)return 'm'}
 const ult=ini[ini.length-1];if(difDias(ult,s)<0)return '';
 const k=difDias(ult,s)%dur;const base=somaDias(s,-k);if(difDias(ult,s)>=dur&&k<c.menst)return 'mp';
 const ov=somaDias(base,dur-14);if(s===ov)return 'o';if(difDias(somaDias(ov,-5),s)>=0&&difDias(s,somaDias(ov,1))>=0)return 'f';return ''}

 const linhaDia=(d,val,txt,pct)=>`<button class="linha" data-acao="dia-det" data-v="${d}" style="text-align:left;color:inherit;font:inherit;width:100%"><span>${d===h?'Hoje':fmtData(d,{weekday:'short',day:'2-digit',month:'short'})}<small>${txt}</small></span><div class="trilho" style="margin:0;width:38%"><i style="width:${pct}%"></i></div><b style="min-width:44px;text-align:right">${val}</b></button>`;
 if(histTipo==='agua'){const v=dias.map(d=>S.agua[d]||0);const med=(v.reduce((a,b)=>a+b,0)/30).toFixed(1).replace('.',',');const bat=v.filter(x=>x>=S.meta_agua).length;
  resumo=`Média de ${med} copos por dia · meta batida em ${bat} de 30 dias`;corpo=dias.map((d,i)=>linhaDia(d,v[i]+'/'+S.meta_agua,(v[i]*250)+' ml',Math.min(100,v[i]/S.meta_agua*100))).join('')}
 else if(histTipo==='treino'){const f=dias.filter(d=>S.treino.feitos.includes(d)).length;resumo=`${f} treino(s) nos últimos 30 dias · ${S.treino.feitos.filter(d=>d.slice(0,7)===h.slice(0,7)).length} este mês`;
  corpo=dias.map(d=>{const p=S.treino.plano[parse(d).getDay()];const ok=S.treino.feitos.includes(d);return linhaDia(d,ok?'✓':(p&&p.ex.length?'—':'💤'),p?p.n:'Descanso',ok?100:0)}).join('')}
 else if(histTipo==='fe'){const b=B();const lidos=[];Object.entries(b.salmos||{}).forEach(([n,d])=>lidos.push([d,'Salmo '+n]));Object.keys(b.prov||{}).forEach(d=>lidos.push([d,'Provérbios '+Math.min(31,+d.slice(8))]));Object.entries((b.anual||{}).dias||{}).forEach(([k,d])=>lidos.push([d,'Bíblia em 1 ano · dia '+(+k+1)]));
  const f=dias.filter(d=>S.fe[d]).length;resumo=`${f} dia(s) com leitura nos últimos 30 · ${lidos.length} leitura(s) concluída(s)`;
  corpo=dias.map(d=>{const l=lidos.filter(x=>x[0]===d).map(x=>x[1]);return linhaDia(d,S.fe[d]?'✓':'—',l.length?l.join(', '):(S.fe[d]?'versículo do dia':'sem leitura'),S.fe[d]?100:0)}).join('')}
 else if(histTipo==='rotina'){const v=dias.map(d=>{const x=itensArvore(d);return x.length?Math.round(x.filter(i=>i.ok).length/x.length*100):0});resumo=`Média de ${Math.round(v.reduce((a,b)=>a+b,0)/30)}% da rotina concluída · ${v.filter(x=>x===100).length} árvore(s) florida(s)`;
  corpo=dias.map((d,i)=>{const x=itensArvore(d);return linhaDia(d,v[i]+'%',x.filter(k=>k.ok).length+' de '+x.length+' concluídos',v[i])}).join('')}
 else{const meses=[...new Set(S.fin.map(f=>f.d.slice(0,7)))].sort().reverse();resumo=meses.length?`${meses.length} mês(es) com lançamentos`:'Nenhum lançamento ainda';
  corpo=meses.map(m=>{const L=S.fin.filter(f=>f.d.slice(0,7)===m);const e=L.filter(f=>f.tipo==='e').reduce((a,f)=>a+f.v,0),sa=L.filter(f=>f.tipo==='s').reduce((a,f)=>a+f.v,0);const [y,mm]=m.split('-').map(Number);
   return `<button class="linha" data-acao="fin-ir" data-v="${m}" style="text-align:left;color:inherit;font:inherit;width:100%"><span>${new Date(y,mm-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}<small>entrou ${brl(e)} · saiu ${brl(sa)}</small></span><b class="${e-sa>=0?'pos':'neg'}">${brl(e-sa)}</b>${ic('seta')}</button>`}).join('')||'<p class="vazio">Sem histórico.</p>'}
 return `<h2 class="tit">Histórico</h2><p class="sub">Toque num dia para ver os detalhes</p>${chips}<div class="vidro cartao sec"><b><span class="tag-ic">${VI[HT[histTipo][0]]}</span> ${HT[histTipo][1]}</b><p class="sub" style="font-size:14px;margin-top:4px">${resumo}</p></div><div class="lista sec">${corpo}</div>`}

function proximaTarefa(){const h=hoje();const dt=new Date();const ag=dt.getHours()*60+dt.getMinutes();const bf=S.blocosFeitos[h]||{};const bl=blocosDe(h);
 const atras=bl.filter(b=>!bf[b.id]&&minDe(b.fim)<=ag);
 const b=bl.find(b=>!bf[b.id]&&minDe(b.fim)>ag);
 const cmp=S.agenda.filter(a=>a.d===h&&a.h&&!a.ok&&minDe(a.h)>=ag-30).sort((x,y)=>x.h.localeCompare(y.h))[0];
 let it=null;
 if(b&&(!cmp||minDe(b.ini)<=minDe(cmp.h)))it={tipo:'bloco',id:b.id,t:b.t,ini:b.ini,fim:b.fim,m:minDe(b.ini)};
 else if(cmp)it={tipo:'agenda',id:cmp.id,t:cmp.t,ini:cmp.h,m:minDe(cmp.h)};
 else{const t=S.tarefas.find(t=>!t.feito);if(t)it={tipo:'tarefa',id:t.id,t:t.t}}
 return {it,atras,ag}}
function alertaProxima(){const {it,atras,ag}=proximaTarefa();
 if(!it&&!atras.length)return `<div class="alerta ok"><span class="al-ic">${VI.brilho}</span><div><small>Próxima tarefa</small><b>Tudo concluído por hoje!</b><span>Aproveite seu descanso 💜</span></div></div>`;
 let quando='';if(it&&it.m!=null){const d=it.m-ag;quando=d<=0?(it.fim?'agora · até '+it.fim:'agora'):d<60?'em '+d+' min · '+it.ini:'às '+it.ini}else if(it)quando='tarefa sem horário';
 const agora=it&&it.m!=null&&it.m-ag<=0;
 return `<div class="alerta ${agora?'agora':''}" role="status"><span class="al-ic">${agora?VI.relogio:VI.sino}</span><div><small>${agora?'Acontecendo agora':'Próxima tarefa'}</small><b>${it?esc(it.t):'Blocos atrasados'}</b><span>${quando}${atras.length?` · <em>${atras.length} atrasado(s)</em>`:''}</span></div>
 <div class="al-acoes">${it?`<button class="btn p peq" data-acao="prox-ok" data-tipo="${it.tipo}" data-id="${it.id}">Concluir ✓</button>`:''}<button class="btn peq" data-ir="rotina">Rotina ›</button></div></div>`}

 <div class="sec"><h3>Lançamentos${finFiltro?` · ${finFiltro==='e'?'entradas':'saídas'} <button class="btn peq" data-acao="fin-filtro" data-v="">ver todos</button>`:''}</h3><div class="lista">${L.length?L.filter(f=>!finFiltro||f.tipo===finFiltro).map(f=>`<div class="linha"><span>${esc(f.desc)}<small>${fmtData(f.d)} · ${esc(f.c)}</small></span><b class="${f.tipo==='e'?'pos':'neg'}">${f.tipo==='e'?'+':'−'} ${brl(f.v)}</b><button class="ed2" data-acao="fin-ed" data-id="${f.id}" aria-label="Editar">${ic('lapis')}</button><button class="x" data-acao="fin-x" data-id="${f.id}" aria-label="Apagar">${ic('x')}</button></div>`).join(''):'<p class="vazio">Nenhum lançamento neste mês.</p>'}</div></div>`}

 <p class="dica" style="text-align:center;margin-top:24px">Life Trail da Juliana · feito pelo Studio Evolution Tech</p>`}

/* ---------- ações ---------- */
function dlg(html,ok){const d=$('#dlg');d.innerHTML=html;d.showModal();const f=d.querySelector('form');if(f)f.onsubmit=e=>{e.preventDefault();if(ok(new FormData(f))!==false){d.close();salvar();render()}};d.querySelectorAll('[data-fechar]').forEach(b=>b.onclick=()=>d.close())}
const num=v=>parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0;
document.addEventListener('click',e=>{const fc=e.target.closest('dialog [data-fechar]');if(fc){const dd=fc.closest('dialog');setTimeout(()=>dd.open&&dd.close(),0)}});
document.addEventListener('click',e=>{const a=e.target.closest('[data-ir],[data-acao]');if(!a)return;
 if(a.dataset.ir){const dd=a.closest('dialog');if(dd)dd.close();ir(a.dataset.ir);return}
 const id=a.dataset.id,v=a.dataset.v,h=hoje();
 switch(a.dataset.acao){
 case 'agua-mais':S.agua[h]=Math.min(S.meta_agua,(S.agua[h]||0)+1);toast(S.agua[h]>=S.meta_agua?'Meta de água batida! 💧':'Mais um copo 💧 '+nomePet()+' agradece');break;
 case 'agua':{const n=+a.dataset.n;S.agua[h]=(S.agua[h]||0)===n?n-1:n;break}
 case 'verso':versoExtra++;break;
 case 'ler':{const [vv,rr]=versoHoje();dlg(`<h3>Palavra de hoje 📖</h3><blockquote style="margin:0;font:500 20px/1.45 var(--serif)">“${esc(vv)}”</blockquote><p style="margin:8px 0 0;font-weight:800;letter-spacing:.14em;font-size:12px;color:var(--acc)">${esc(rr).toUpperCase()}</p><div class="dlg-acoes"><button type="button" class="btn" data-acao="verso" data-fechar>Outro versículo</button><button class="btn p" data-acao="fe-ok" data-fechar>Li e guardei no coração ✓</button></div>`,()=>{});return}
 case 'fe-ok':if(!S.fe[h]){S.fe[h]=true;confete(['📖','✨','💜','🕊️']);toast(nomePet()+' ficou mais feliz 📖')}break;
 case 'pet':{const el=a;el.classList.add('pula');setTimeout(()=>el.classList.remove('pula'),380);const fl=$('#fala');if(fl){const L=fala();fl.textContent=L[Math.floor(Math.random()*L.length)];fl.classList.add('on');clearTimeout(fl._t);fl._t=setTimeout(()=>fl.classList.remove('on'),2400)}
  const t=a.closest('.terrario');for(let k=0;k<4;k++){const c=document.createElement('span');c.className='coracao';c.textContent=['💜','💖','✨','💕'][k];c.style.left=(40+Math.random()*20)+'%';c.style.top='48%';c.style.setProperty('--x',(Math.random()*80-40)+'px');t.append(c);setTimeout(()=>c.remove(),1200)}return}
 case 'tarefa':{const t=S.tarefas.find(x=>x.id===id);t.feito=t.feito?null:h;if(t.feito)toast(nomePet()+' ficou mais feliz ✨');break}
 case 'tarefa-x':S.tarefas=S.tarefas.filter(x=>x.id!==id);break;
 case 'habito':{const d=S.habDias[h]=S.habDias[h]||{};d[id]=!d[id];break}
 case 'habito-x':S.habitos=S.habitos.filter(x=>x.id!==id);break;
 case 'agenda':{const x=S.agenda.find(y=>y.id===id);x.ok=!x.ok;break}
 case 'agenda-x':S.agenda=S.agenda.filter(x=>x.id!==id);break;

#pm-intro .ab-nome{display:flex;justify-content:center;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(58px,16vw,100px);line-height:1.12;padding:0 .1em .08em;letter-spacing:-2px;transform:translateZ(60px)}
#pm-intro .ab-nome-in{display:inline-block;opacity:0;animation:pmNome 1.1s cubic-bezier(.2,.8,.2,1) .9s forwards}
@keyframes pmNome{from{opacity:0;transform:scale(.86);letter-spacing:10px}to{opacity:1;transform:none;letter-spacing:-2px}}
#pm-intro .ab-linha{width:0;height:1.5px;margin:4px auto 14px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--acc2,#f3c9b3),#fff,var(--acc2,#f3c9b3),transparent);transform:translateZ(36px);animation:pmLinha 1s ease 1.5s forwards}
@keyframes pmLinha{to{width:min(220px,58vw)}}
#pm-intro .ab-data,#pm-intro .ab-frase{opacity:0;animation:pmSurge .8s ease forwards}
#pm-intro .ab-data{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,240,232,.85);transform:translateZ(30px);animation-delay:1.8s}
#pm-intro .ab-frase{margin:12px auto 0;max-width:30ch;font-size:16px;line-height:1.5;color:#fff;transform:translateZ(30px);animation-delay:2.2s}
@keyframes pmSurge{from{opacity:0}to{opacity:1}}
#pm-intro .ab-toque{width:100%;text-align:center;position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.55);opacity:0;animation:pmSurge .6s ease 2.8s forwards}
@media(min-width:900px){#pm-intro .ab-foto{background-size:contain!important;background-position:50% 50%!important}#pm-intro{justify-content:center;align-items:flex-end;padding-right:7vw}#pm-intro .ab-foto{inset:0 46% 0 0;background-size:cover;background-position:50% 10%;-webkit-mask-image:linear-gradient(90deg,#000 65%,transparent);mask-image:linear-gradient(90deg,#000 65%,transparent)}#pm-intro .ab-vel{background:radial-gradient(ellipse 60% 70% at 30% 50%,transparent,rgba(13,10,12,.5))}#pm-intro .ab-cena{width:min(44vw,520px)}}
@media (prefers-reduced-motion:reduce){#pm-intro *{animation-duration:.01s!important;animation-delay:0s!important}#pm-intro{transition-duration:.3s}}
@keyframes pmOuro{to{background-position:260% 0}}
</style>
<script id="lt-abertura-js">
(function(){
const FRASES={manha:['Que hoje seja leve, bonito e cheio de propósito.','Um novo dia para cuidar de você e de quem você ama.','Respira fundo: hoje vai dar certo.'],
 tarde:['Você está indo muito bem. Continue no seu ritmo.','Uma pausa, um copo de água e segue firme.','Metade do dia vencida. Orgulho de você.'],
 noite:['Descansa. Você fez o seu melhor hoje.','Hora de desacelerar e agradecer pelo dia.','Que a sua noite seja de paz e de sono bom.']};
let aberto=false,timer;
const quieto=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
function periodo(){const h=new Date().getHours();return h>=5&&h<12?'manha':h>=12&&h<18?'tarde':'noite'}
function nome(){try{const n=window.ltNome&&window.ltNome();if(n)return String(n).split(/\s+/)[0]}catch(e){}const t=(document.title.split('·').pop()||'').trim();return t||'Você'}
function fotoUrl(){try{if(window.ltFoto)return window.ltFoto()}catch(e){}return ''}
const G='<defs><linearGradient id="ltg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="var(--acc2,#f0c0a6)"/><stop offset="1" stop-color="var(--acc,#c98a70)"/></linearGradient></defs>';
const SOL='<svg viewBox="0 0 48 48" fill="none" stroke="url(#ltg)" stroke-width="2.2" stroke-linecap="round">'+G+'<circle cx="24" cy="24" r="8.5"/><path d="M24 5v5M24 38v5M5 24h5M38 24h5M10.6 10.6l3.5 3.5M33.9 33.9l3.5 3.5M10.6 37.4l3.5-3.5M33.9 14.1l3.5-3.5"/></svg>';
const LUA='<svg viewBox="0 0 48 48" fill="none" stroke="url(#ltg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+G+'<path d="M36 30.5A15 15 0 0 1 17.5 12a15 15 0 1 0 18.5 18.5Z"/><path d="M34 8v5M31.5 10.5h5M40 17v3M38.5 18.5h3"/></svg>';
function mostrar(){
 if(aberto||document.body.classList.contains('travado'))return;aberto=true;
 const p=periodo(),sau={manha:'Bom dia,',tarde:'Boa tarde,',noite:'Boa noite,'}[p];
 const d=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
 const fr=FRASES[p][new Date().getDate()%FRASES[p].length];
 const el=document.createElement('dialog');el.id='pm-intro';el.className=p;el.setAttribute('aria-label',sau+' '+nome());
 const f=fotoUrl();if(f)el.style.setProperty('--hf','url("'+f+'")');
 let pts='';for(let i=0;i<(p==='noite'?40:26);i++){const s=(Math.random()*2.5+1.2).toFixed(1);pts+=p==='noite'
  ?`<b style="left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*70).toFixed(1)}%;width:${s}px;height:${s}px;animation-duration:${(Math.random()*3+2).toFixed(1)}s;animation-delay:${(Math.random()*2).toFixed(1)}s"></b>`
  :`<b style="left:${(Math.random()*100).toFixed(1)}%;width:${s}px;height:${s}px;animation-duration:${(Math.random()*5+5).toFixed(1)}s;animation-delay:${(Math.random()*4).toFixed(1)}s"></b>`}
 el.innerHTML=`${f?'<div class="ab-foto"></div>':''}<div class="ab-vel"></div><div class="ab-pts">${pts}</div><div class="ab-cena"><div class="ab-cartao"><span class="ab-vidro"></span><i class="ab-borda"></i><div class="ab-cam"><span class="ab-astro">${p==='noite'?LUA:SOL}</span><div class="ab-sau"><span class="ab-sau-in ab-rg">${sau}</span></div><span class="ab-nome ab-rg"><span class="ab-nome-in">${nome()}</span></span><div class="ab-linha"></div><div class="ab-data">${d}</div><div class="ab-frase">${fr}</div></div></div></div><div class="ab-toque">toque para entrar</div>`;
 const mexe=(x,y)=>{el.style.setProperty('--mx',Math.max(-1,Math.min(1,x)).toFixed(3));el.style.setProperty('--my',Math.max(-1,Math.min(1,y)).toFixed(3))};
 el.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){el._mexeu=true;mexe((e.clientX/innerWidth-.5)*2,(e.clientY/innerHeight-.5)*2)}});
 const ori=e=>{if(e.gamma!=null){el._mexeu=true;mexe(e.gamma/30,(e.beta-45)/30)}};addEventListener('deviceorientation',ori);el._ori=ori;
 if(!quieto()){const t0=performance.now();(function flut(t){if(!el.isConnected)return;if(!el._mexeu){const k=(t-t0)/1000;mexe(Math.sin(k*.9)*.35,Math.cos(k*.7)*.25)}requestAnimationFrame(flut)})(t0)}
 document.body.append(el);try{el.showModal()}catch(e){el.setAttribute('open','')}el.addEventListener('cancel',e=>{e.preventDefault();recolher()});el.addEventListener('click',recolher);timer=setTimeout(recolher,5200);
}
function recolher(){clearTimeout(timer);const el=document.getElementById('pm-intro');if(!el||el.classList.contains('recolhe'))return;
 const alvo=document.querySelector('.hero,.ola,.topo,header');let r=alvo?alvo.getBoundingClientRect():null;
 if(!r||r.bottom<0||r.top>innerHeight||r.height<20)r={top:innerHeight*.12,left:innerWidth*.06,right:innerWidth*.94,bottom:innerHeight*.32};
 el.style.setProperty('--alvo',`inset(${Math.max(0,r.top)}px ${Math.max(0,innerWidth-r.right)}px ${Math.max(0,innerHeight-r.bottom)}px ${Math.max(0,r.left)}px round 24px)`);
 el.classList.add('recolhe');setTimeout(()=>{removeEventListener('deviceorientation',el._ori);try{el.close()}catch(e){}el.remove();aberto=false;setTimeout(soltar,150)},1200)}
window.ltAbertura=mostrar;
// avisos do app (ex.: "Chegou um ovo") esperam a abertura terminar
const fila=[];const orig=HTMLDialogElement.prototype.showModal;
HTMLDialogElement.prototype.showModal=function(){if(aberto&&this.id!=='pm-intro'){fila.push(this);return}return orig.call(this)};
const soltar=()=>{while(fila.length){const d=fila.shift();try{if(!d.open&&d.isConnected)orig.call(d)}catch(e){}}};
let escondidoEm=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)escondidoEm=Date.now();else if(escondidoEm&&Date.now()-escondidoEm>30*60*1000)mostrar()});
// abre quando o cadeado sai (ou logo ao carregar, se nao houver cadeado)
let foiTravado=false;
new MutationObserver(()=>{const t=document.body.classList.contains('travado');if(t)foiTravado=true;else if(foiTravado){foiTravado=false;setTimeout(mostrar,120)}}).observe(document.body,{attributes:true,attributeFilter:['class']});
function iniciar(){if(document.body.classList.contains('travado'))foiTravado=true;else mostrar()}
if(document.readyState==='complete')setTimeout(iniciar,250);else addEventListener('load',()=>setTimeout(iniciar,250));
})();
</script>
</body>
</html>
